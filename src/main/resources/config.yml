# Recycling station block (TLibs BlockChecker path).
station:
  block: iaf(tfmc:recycling_station)
  permission: recycler.use
  complete_effects:
    sound: block.anvil.land
    sound_volume: 0.55
    sound_pitch: 0.92
    extra_sound: none
    extra_sound_volume: 0.0
    extra_sound_pitch: 1.0
    extra_sound_delay_ticks: 0
    particle: CRIT
    particle_count: 10
    particle_radius: 0.35
    extra_particle: none
    extra_particle_count: 0
    extra_particle_radius: 0.0
  result_spawn:
    kick_velocity_min: 0.09
    kick_velocity_max: 0.19
    kick_horizontal_min: 0.01
    kick_horizontal_max: 0.03
    trail_ticks: 140
    trail_interval_ticks: 2
    burst_particles: true
    stagger_ticks: 3

# Share of the original craft materials each item type returns, 0.0-1.0 (0.5 = 50%).
# Applied before durability scaling (worn items return less) and rounded down per deposit.
# Weapons, guns and jewelry crafted before their plugin recorded what was used cannot be recycled.
# Values outside 0.0-1.0 are clamped. A missing entry falls back to the old max_return_rate
# (crafted items) or scrap_return_rate (alloy scrap) key if present.
return_rates:
  # AdvancedCrafting equipment: its recorded ingredients, and each alloy's base + catalysts.
  advanced_crafting: 0.5
  # Independent chance per recorded non-gem material unit in failed-forge scrap.
  # Scrap forged before AdvancedCrafting 2.2.0 has no recorded base and cannot be recycled.
  alloy_scrap: 0.5
  # Magic mage weapons: the materials charged when the weapon was crafted.
  magic_gear: 0.5
  # GunsAndGadgets guns: the materials taken when the gun was crafted.
  guns: 0.5
  # GemInfusion goldsmithing jewelry: the materials deposited on the bench (the infused gem is not returned).
  goldsmith_jewelry: 0.5
  # Items with no crafting record, recycled through the hand-written files in recipes/*.yml.
  # Each file lists an input item and fixed outputs (e.g. runes -> 2 enchanted dust).
  # This multiplies those listed amounts: 1.0 gives exactly what the file says, 0.5 gives half.
  recipes: 1.0

# Independent recovery chance per gem unit consumed by a failed alloy forge (0.0-1.0).
# Uses the gem ingredient's tier in AdvancedCrafting, regardless of its ingredient type.
# Amounts and stacked scrap roll each material unit separately. Preview shows possible returns.
# Older scrap has no catalyst record and can return only its recorded base.
scrap_gem_return_rates:
  default: 0.01
  tiers:
    '1': 0.01
    '2': 0.25
    '3': 0.5
    '4': 0.75

# Deterministic outputs round down. Blocks confirms with no possible yield;
# a failed scrap recovery roll still consumes the scrap.
block_confirm_when_zero_yield: true

# Deposit policy (checked before provider resolution).
deposit:
  whitelist_mode: false
  whitelist_paths: []
  blacklist_paths: []
  block_unbreakable: true

# Interaction sounds (open, accept, reject, preview, confirm, cancel).
# Station complete particles/sounds are under station.complete_effects.
effects:
  open:
    sound: block.stone_button.click_on
    sound_volume: 0.6
    sound_pitch: 1.0
  input_accept:
    sound: entity.item_frame.place
    sound_volume: 0.5
    sound_pitch: 1.2
  input_reject:
    sound: entity.villager.no
    sound_volume: 0.8
    sound_pitch: 1.0
  preview_refresh:
    sound: block.grindstone.use
    sound_volume: 0.3
    sound_pitch: 1.4
  confirm:
    sound: block.anvil.use
    sound_volume: 0.7
    sound_pitch: 1.1
  complete:
    sound: block.anvil.land
    sound_volume: 0.55
    sound_pitch: 0.92
  cancel:
    sound: block.note_block.bass
    sound_volume: 0.8
    sound_pitch: 0.6
